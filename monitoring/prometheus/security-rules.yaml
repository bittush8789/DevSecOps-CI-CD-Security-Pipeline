apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-alerts
  namespace: monitoring
spec:
  groups:
  - name: security.rules
    rules:
    - alert: HighUnauthorizedAttempts
      expr: rate(http_requests_total{status="401"}[5m]) > 10
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "High number of unauthorized attempts detected"
